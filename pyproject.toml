[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-gym-tenki"
version = "0.2.0"
description = "Tenki (Firecracker microVM) sandbox provider for NVIDIA NeMo Gym"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Luxor AI / Tenki DevRel" }]
keywords = ["nemo-gym", "tenki", "sandbox", "reinforcement-learning", "microvm"]
dependencies = [
  "tenki>=1.4.1,<2",
]
# NOTE: NeMo Gym itself (the `nemo_gym` package) is the host runtime and must be
# installed in the same environment -- it provides the sandbox-provider protocol
# this package implements and discovers the entry point below. It is intentionally
# NOT pinned here as a hard dependency so `pip install nemo-gym-tenki` never tries
# to (re)install NeMo Gym over an existing checkout.

[project.urls]
Homepage = "https://tenki.cloud"
"NeMo Gym" = "https://github.com/NVIDIA-NeMo/Gym"

# This is what makes `sandbox_provider: {tenki: {...}}` work: NeMo Gym discovers
# providers published under this entry-point group at install time.
[project.entry-points."nemo_gym.sandbox_providers"]
tenki = "nemo_gym_tenki.provider:TenkiProvider"

[tool.hatch.build.targets.wheel]
packages = ["nemo_gym_tenki"]
